<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" fill="#374151">
  <title>Las cuatro familias de herramientas de simulación</title>
  <defs>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a56db"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="38" font-size="24" font-weight="700" text-anchor="middle">Cuatro familias de herramientas</text>

  <!-- Flecha superior: flexibilidad -->
  <text x="500" y="76" font-size="18" font-weight="700" text-anchor="middle" fill="#1a56db">más flexibilidad: más podés salirte del molde</text>
  <line x1="970" y1="96" x2="30" y2="96" stroke="#1a56db" stroke-width="3.5" marker-end="url(#flecha-azul)"/>

  <!-- Tarjeta 1 -->
  <rect x="24" y="116" width="226" height="276" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="137" y="148" font-size="18" font-weight="700" text-anchor="middle">Lenguaje de</text>
  <text x="137" y="171" font-size="18" font-weight="700" text-anchor="middle">propósito general</text>
  <text x="137" y="200" font-size="16" font-style="italic" text-anchor="middle">Python, Java</text>
  <text x="137" y="234" font-size="16" text-anchor="middle">Nada específico:</text>
  <text x="137" y="256" font-size="16" text-anchor="middle">hay que construir todo</text>
  <rect x="34" y="284" width="206" height="38" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="44" y="309" font-size="16">Flexibilidad</text>
  <text x="230" y="309" font-size="16" font-weight="700" text-anchor="end" fill="#1a56db">máxima</text>
  <rect x="34" y="334" width="206" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="44" y="359" font-size="16">Desarrollo</text>
  <text x="230" y="359" font-size="16" font-weight="700" text-anchor="end">muy alto</text>

  <!-- Tarjeta 2 -->
  <rect x="266" y="116" width="226" height="276" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="379" y="148" font-size="18" font-weight="700" text-anchor="middle">Biblioteca de</text>
  <text x="379" y="171" font-size="18" font-weight="700" text-anchor="middle">simulación</text>
  <text x="379" y="200" font-size="16" font-style="italic" text-anchor="middle">SimPy</text>
  <text x="379" y="234" font-size="16" text-anchor="middle">Aporta el motor;</text>
  <text x="379" y="256" font-size="16" text-anchor="middle">la lógica va en código</text>
  <rect x="276" y="284" width="206" height="38" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="286" y="309" font-size="16">Flexibilidad</text>
  <text x="472" y="309" font-size="16" font-weight="700" text-anchor="end" fill="#1a56db">alta</text>
  <rect x="276" y="334" width="206" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="286" y="359" font-size="16">Desarrollo</text>
  <text x="472" y="359" font-size="16" font-weight="700" text-anchor="end">alto</text>

  <!-- Tarjeta 3 -->
  <rect x="508" y="116" width="226" height="276" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="621" y="148" font-size="18" font-weight="700" text-anchor="middle">Lenguaje de</text>
  <text x="621" y="171" font-size="18" font-weight="700" text-anchor="middle">simulación</text>
  <text x="621" y="200" font-size="16" font-style="italic" text-anchor="middle">GPSS, SIMSCRIPT</text>
  <text x="621" y="234" font-size="16" text-anchor="middle">Sus primitivas ya son</text>
  <text x="621" y="256" font-size="16" text-anchor="middle">conceptos de simulación</text>
  <rect x="518" y="284" width="206" height="38" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="528" y="309" font-size="16">Flexibilidad</text>
  <text x="714" y="309" font-size="16" font-weight="700" text-anchor="end" fill="#1a56db">media alta</text>
  <rect x="518" y="334" width="206" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="528" y="359" font-size="16">Desarrollo</text>
  <text x="714" y="359" font-size="16" font-weight="700" text-anchor="end">medio</text>

  <!-- Tarjeta 4 -->
  <rect x="750" y="116" width="226" height="276" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="863" y="148" font-size="18" font-weight="700" text-anchor="middle">Simulador</text>
  <text x="863" y="171" font-size="18" font-weight="700" text-anchor="middle">visual</text>
  <text x="863" y="200" font-size="16" font-style="italic" text-anchor="middle">con interfaz gráfica</text>
  <text x="863" y="234" font-size="16" text-anchor="middle">Trae motor, objetos,</text>
  <text x="863" y="256" font-size="16" text-anchor="middle">animación y reportes</text>
  <rect x="760" y="284" width="206" height="38" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="770" y="309" font-size="16">Flexibilidad</text>
  <text x="956" y="309" font-size="16" font-weight="700" text-anchor="end" fill="#1a56db">media</text>
  <rect x="760" y="334" width="206" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="770" y="359" font-size="16">Desarrollo</text>
  <text x="956" y="359" font-size="16" font-weight="700" text-anchor="end">bajo</text>

  <!-- Flecha inferior: viene más resuelto -->
  <line x1="30" y1="416" x2="970" y2="416" stroke="#059669" stroke-width="3.5" marker-end="url(#flecha-verde)"/>
  <text x="500" y="448" font-size="18" font-weight="700" text-anchor="middle" fill="#059669">viene más resuelto: menos tiempo de desarrollo, modelás más rápido</text>

  <!-- Notas -->
  <text x="500" y="496" font-size="16" text-anchor="middle">No hay opción universalmente mejor: flexibilidad y velocidad de desarrollo son inversas.</text>
  <text x="500" y="522" font-size="16" text-anchor="middle">La frontera entre la tercera y la cuarta es porosa: los simuladores visuales traen lenguajes internos.</text>
</svg>
