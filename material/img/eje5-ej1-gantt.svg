<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" font-family="Segoe UI, Arial, sans-serif">
  <title>Ejercicio 1: la corrida, un renglón por cliente</title>
  <defs>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a56db"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="545" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">Ejercicio 1: la corrida, un renglón por cliente</text>

  <!-- Leyenda -->
  <rect x="130" y="46" width="30" height="18" rx="2" fill="#d97706"/>
  <text x="168" y="61" font-size="16" fill="#374151">espera en cola</text>
  <rect x="300" y="46" width="30" height="18" rx="2" fill="#1a56db"/>
  <text x="338" y="61" font-size="16" fill="#374151">atención</text>
  <polygon points="445,46 459,46 452,62" fill="#374151"/>
  <text x="466" y="61" font-size="16" fill="#374151">llegada</text>
  <line x1="562" y1="47" x2="562" y2="64" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="574" y="61" font-size="16" fill="#374151">empieza cuando termina el anterior</text>

  <!-- Grilla: un minuto = 28 px, x = 130 + 28 t -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="158" y1="80" x2="158" y2="424"/><line x1="186" y1="80" x2="186" y2="424"/>
    <line x1="214" y1="80" x2="214" y2="424"/><line x1="242" y1="80" x2="242" y2="424"/>
    <line x1="298" y1="80" x2="298" y2="424"/><line x1="326" y1="80" x2="326" y2="424"/>
    <line x1="354" y1="80" x2="354" y2="424"/><line x1="382" y1="80" x2="382" y2="424"/>
    <line x1="438" y1="80" x2="438" y2="424"/><line x1="466" y1="80" x2="466" y2="424"/>
    <line x1="494" y1="80" x2="494" y2="424"/><line x1="522" y1="80" x2="522" y2="424"/>
    <line x1="578" y1="80" x2="578" y2="424"/><line x1="606" y1="80" x2="606" y2="424"/>
    <line x1="634" y1="80" x2="634" y2="424"/><line x1="662" y1="80" x2="662" y2="424"/>
    <line x1="718" y1="80" x2="718" y2="424"/><line x1="746" y1="80" x2="746" y2="424"/>
    <line x1="774" y1="80" x2="774" y2="424"/><line x1="802" y1="80" x2="802" y2="424"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="130" y1="80" x2="130" y2="424"/><line x1="270" y1="80" x2="270" y2="424"/>
    <line x1="410" y1="80" x2="410" y2="424"/><line x1="550" y1="80" x2="550" y2="424"/>
    <line x1="690" y1="80" x2="690" y2="424"/>
  </g>

  <!-- Encabezado de la columna de esperas -->
  <text x="905" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">Espera</text>

  <!-- Cliente 1: llega 0, atención 0 a 2 -->
  <text x="20" y="114" font-size="16" fill="#374151">Cliente 1</text>
  <polygon points="123,84 137,84 130,96" fill="#374151"/>
  <rect x="130" y="96" width="56" height="24" fill="#1a56db"/>
  <text x="905" y="114" text-anchor="middle" font-size="16" fill="#374151">0</text>

  <!-- Cliente 2: llega 7, atención 7 a 10 -->
  <text x="20" y="156" font-size="16" fill="#374151">Cliente 2</text>
  <polygon points="319,126 333,126 326,138" fill="#374151"/>
  <rect x="326" y="138" width="84" height="24" fill="#1a56db"/>
  <text x="905" y="156" text-anchor="middle" font-size="16" fill="#374151">0</text>

  <!-- Cliente 3: llega 8, espera 8 a 10, atención 10 a 12 -->
  <text x="20" y="198" font-size="16" fill="#374151">Cliente 3</text>
  <polygon points="347,168 361,168 354,180" fill="#374151"/>
  <rect x="354" y="180" width="56" height="24" fill="#d97706"/>
  <rect x="410" y="180" width="56" height="24" fill="#1a56db"/>
  <line x1="410" y1="162" x2="410" y2="179" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="198" text-anchor="middle" font-size="16" fill="#374151">2</text>

  <!-- Cliente 4: llega 9, espera 9 a 12, atención 12 a 14 -->
  <text x="20" y="240" font-size="16" fill="#374151">Cliente 4</text>
  <polygon points="375,210 389,210 382,222" fill="#374151"/>
  <rect x="382" y="222" width="84" height="24" fill="#d97706"/>
  <rect x="466" y="222" width="56" height="24" fill="#1a56db"/>
  <line x1="466" y1="204" x2="466" y2="221" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="240" text-anchor="middle" font-size="16" fill="#374151">3</text>

  <!-- Cliente 5: llega 11, espera 11 a 14, atención 14 a 16 -->
  <text x="20" y="282" font-size="16" fill="#374151">Cliente 5</text>
  <polygon points="431,252 445,252 438,264" fill="#374151"/>
  <rect x="438" y="264" width="84" height="24" fill="#d97706"/>
  <rect x="522" y="264" width="56" height="24" fill="#1a56db"/>
  <line x1="522" y1="246" x2="522" y2="263" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="282" text-anchor="middle" font-size="16" fill="#374151">3</text>

  <!-- Cliente 6: llega 14, espera 14 a 16, atención 16 a 18 -->
  <text x="20" y="324" font-size="16" fill="#374151">Cliente 6</text>
  <polygon points="515,294 529,294 522,306" fill="#374151"/>
  <rect x="522" y="306" width="56" height="24" fill="#d97706"/>
  <rect x="578" y="306" width="56" height="24" fill="#1a56db"/>
  <line x1="578" y1="288" x2="578" y2="305" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="324" text-anchor="middle" font-size="16" fill="#374151">2</text>

  <!-- Cliente 7: llega 15, espera 15 a 18, atención 18 a 23 -->
  <text x="20" y="366" font-size="16" fill="#374151">Cliente 7</text>
  <polygon points="543,336 557,336 550,348" fill="#374151"/>
  <rect x="550" y="348" width="84" height="24" fill="#d97706"/>
  <rect x="634" y="348" width="140" height="24" fill="#1a56db"/>
  <line x1="634" y1="330" x2="634" y2="347" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="366" text-anchor="middle" font-size="16" fill="#374151">3</text>

  <!-- Cliente 8: llega 20, espera 20 a 23, atención 23 a 25 -->
  <text x="20" y="408" font-size="16" fill="#374151">Cliente 8</text>
  <polygon points="683,378 697,378 690,390" fill="#374151"/>
  <rect x="690" y="390" width="84" height="24" fill="#d97706"/>
  <rect x="774" y="390" width="56" height="24" fill="#1a56db"/>
  <line x1="774" y1="372" x2="774" y2="389" stroke="#1a56db" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flecha-azul)"/>
  <text x="905" y="408" text-anchor="middle" font-size="16" fill="#374151">3</text>

  <!-- Suma de esperas -->
  <line x1="872" y1="424" x2="938" y2="424" stroke="#374151" stroke-width="1.5"/>
  <text x="905" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">Suma 16</text>

  <!-- Horizonte T -->
  <line x1="830" y1="80" x2="830" y2="424" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Eje de tiempo -->
  <line x1="130" y1="424" x2="830" y2="424" stroke="#374151" stroke-width="2"/>
  <g font-size="16" fill="#374151" text-anchor="middle">
    <text x="130" y="448">0</text><text x="158" y="448">1</text><text x="186" y="448">2</text>
    <text x="214" y="448">3</text><text x="242" y="448">4</text><text x="270" y="448">5</text>
    <text x="298" y="448">6</text><text x="326" y="448">7</text><text x="354" y="448">8</text>
    <text x="382" y="448">9</text><text x="410" y="448">10</text><text x="438" y="448">11</text>
    <text x="466" y="448">12</text><text x="494" y="448">13</text><text x="522" y="448">14</text>
    <text x="550" y="448">15</text><text x="578" y="448">16</text><text x="606" y="448">17</text>
    <text x="634" y="448">18</text><text x="662" y="448">19</text><text x="690" y="448">20</text>
    <text x="718" y="448">21</text><text x="746" y="448">22</text><text x="774" y="448">23</text>
    <text x="802" y="448">24</text><text x="830" y="448">25</text>
  </g>
  <text x="480" y="476" text-anchor="middle" font-size="16" fill="#374151">Tiempo (minutos)</text>
  <text x="830" y="476" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">T = 25</text>

  <!-- Resultado -->
  <rect x="24" y="492" width="912" height="40" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
  <text x="480" y="518" text-anchor="middle" font-size="17" fill="#374151">Wq = suma de esperas ÷ cantidad de clientes = 16 ÷ 8 = <tspan font-weight="700" fill="#1a56db">2 minutos</tspan></text>
</svg>
