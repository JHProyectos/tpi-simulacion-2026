<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif" fill="#374151">
  <title>Diagrama tornado de un análisis de sensibilidad</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="42" font-size="24" font-weight="700" text-anchor="middle">Diagrama tornado: qué supuestos pesan más</text>
  <text x="500" y="70" font-size="17" text-anchor="middle">Cada barra muestra cuánto cambia la espera si el supuesto toma su valor bajo o alto</text>

  <!-- Caso base -->
  <text x="570" y="104" font-size="16" font-weight="700" text-anchor="middle">caso base</text>
  <line x1="570" y1="112" x2="570" y2="380" stroke="#374151" stroke-width="2"/>

  <!-- Fila 1 -->
  <text x="350" y="151" font-size="17" text-anchor="end">Tiempo de atención</text>
  <rect x="370" y="125" width="200" height="40" fill="#1a56db"/>
  <rect x="570" y="125" width="220" height="40" fill="#d97706"/>

  <!-- Fila 2 -->
  <text x="350" y="216" font-size="17" text-anchor="end">Tasa de arribos</text>
  <rect x="410" y="190" width="160" height="40" fill="#1a56db"/>
  <rect x="570" y="190" width="190" height="40" fill="#d97706"/>

  <!-- Fila 3 -->
  <text x="350" y="281" font-size="17" text-anchor="end">Supuesto C</text>
  <rect x="500" y="255" width="70" height="40" fill="#1a56db"/>
  <rect x="570" y="255" width="80" height="40" fill="#d97706"/>

  <!-- Fila 4 -->
  <text x="350" y="346" font-size="17" text-anchor="end">Supuesto D</text>
  <rect x="540" y="320" width="30" height="40" fill="#1a56db"/>
  <rect x="570" y="320" width="35" height="40" fill="#d97706"/>

  <!-- Llaves -->
  <path d="M 805 125 L 813 125 L 813 230 L 805 230" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="825" y="155" font-size="16" font-weight="700">Más largas:</text>
  <text x="825" y="177" font-size="16">más influyentes,</text>
  <text x="825" y="199" font-size="16">conviene</text>
  <text x="825" y="221" font-size="16">medirlas mejor</text>

  <path d="M 805 255 L 813 255 L 813 360 L 805 360" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="825" y="285" font-size="16" font-weight="700">Más cortas:</text>
  <text x="825" y="307" font-size="16">poco impacto,</text>
  <text x="825" y="329" font-size="16">se pueden modelar</text>
  <text x="825" y="351" font-size="16">más simple</text>

  <!-- Eje -->
  <line x1="342" y1="395" x2="798" y2="395" stroke="#374151" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <text x="342" y="420" font-size="16" text-anchor="start">menos espera</text>
  <text x="798" y="420" font-size="16" text-anchor="end">más espera</text>
  <text x="570" y="450" font-size="16" font-weight="700" text-anchor="middle">Cambio en la espera respecto del caso base</text>

  <!-- Leyenda -->
  <rect x="330" y="468" width="18" height="18" fill="#1a56db"/>
  <text x="356" y="483" font-size="16">valor bajo del supuesto</text>
  <rect x="600" y="468" width="18" height="18" fill="#d97706"/>
  <text x="626" y="483" font-size="16">valor alto del supuesto</text>
</svg>
