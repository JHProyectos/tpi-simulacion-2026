<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Arial, sans-serif">
  <title>Las propiedades de un agente: el núcleo obligatorio y lo que no es obligatorio</title>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">Qué tiene que tener un agente y qué no</text>

  <!-- Capa externa: opcionales -->
  <rect x="20" y="70" width="960" height="560" rx="18" fill="#ffffff" stroke="#374151" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="44" y="105" font-size="19" fill="#374151"><tspan font-weight="700">Opcionales:</tspan> proactividad, aprendizaje y capacidad social compleja</text>

  <!-- Capa: frecuente, no obligatoria -->
  <rect x="50" y="125" width="900" height="480" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="74" y="160" font-size="19" fill="#374151"><tspan font-weight="700">Frecuente, no obligatoria:</tspan> heterogeneidad</text>

  <!-- Capa: muy frecuentes, no obligatorias -->
  <rect x="80" y="180" width="840" height="400" rx="14" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="104" y="215" font-size="19" fill="#374151"><tspan font-weight="700">Muy frecuentes, no obligatorias:</tspan> reactividad e interacción</text>

  <!-- Núcleo -->
  <rect x="110" y="235" width="780" height="320" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  <text x="134" y="270" font-size="20" font-weight="700" fill="#374151">Núcleo obligatorio: cuatro preguntas</text>

  <!-- Tarjetas del núcleo -->
  <rect x="134" y="290" width="356" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="154" y="324" font-size="20" font-weight="700" fill="#374151">Identidad</text>
  <text x="154" y="353" font-size="19" fill="#059669" font-weight="700">¿Quién es?</text>
  <text x="154" y="382" font-size="17" fill="#374151">Se distingue de los demás</text>

  <rect x="510" y="290" width="356" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="530" y="324" font-size="20" font-weight="700" fill="#374151">Estado propio</text>
  <text x="530" y="353" font-size="19" fill="#059669" font-weight="700">¿Qué tiene?</text>
  <text x="530" y="382" font-size="17" fill="#374151">Variables que describen su situación</text>

  <rect x="134" y="420" width="356" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="154" y="454" font-size="20" font-weight="700" fill="#374151">Situación en un entorno</text>
  <text x="154" y="483" font-size="19" fill="#059669" font-weight="700">¿Dónde está?</text>
  <text x="154" y="512" font-size="17" fill="#374151">En una grilla, un espacio o una red</text>

  <rect x="510" y="420" width="356" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="530" y="454" font-size="20" font-weight="700" fill="#374151">Autonomía</text>
  <text x="530" y="483" font-size="19" fill="#059669" font-weight="700">¿Se maneja solo?</text>
  <text x="530" y="512" font-size="17" fill="#374151">Nadie le dice paso a paso qué hacer</text>

  <text x="500" y="668" text-anchor="middle" font-size="19" font-weight="700" fill="#374151">Un modelo perfectamente válido puede tener solo el núcleo.</text>
</svg>
