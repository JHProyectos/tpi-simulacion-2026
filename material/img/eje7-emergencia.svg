<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 825" width="1000" height="825" font-family="Segoe UI, Arial, sans-serif">
  <title>Emergencia: reglas locales abajo, patrón global arriba, y los tres casos para reconocerla</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="825" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#374151">Emergencia: un patrón global que nadie programó</text>

  <!-- ===== Parte A: abajo y arriba ===== -->
  <rect x="30" y="62" width="940" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="500" y="101" text-anchor="middle" font-size="19" font-weight="700" fill="#374151">Arriba, lo que aparece: una bandada coordinada que gira y se reagrupa, sin líder</text>

  <line x1="175" y1="223" x2="175" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="500" y1="223" x2="500" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="825" y1="223" x2="825" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>

  <text x="337" y="172" text-anchor="middle" font-size="17" fill="#374151">Interacción repetida,</text>
  <text x="337" y="195" text-anchor="middle" font-size="17" fill="#374151">tick tras tick</text>

  <rect x="535" y="144" width="255" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="662" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">Ninguna regla global</text>
  <text x="662" y="194" text-anchor="middle" font-size="17" fill="#374151">dice «formen una bandada»</text>

  <rect x="30" y="225" width="290" height="72" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="175" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">No chocarse</text>
  <rect x="355" y="225" width="290" height="72" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="500" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">Apuntar hacia donde</text>
  <text x="500" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">apuntan los vecinos</text>
  <rect x="680" y="225" width="290" height="72" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="825" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#374151">No quedarse solo</text>

  <text x="500" y="326" text-anchor="middle" font-size="17" fill="#374151">Abajo, lo que programa el modelador: tres reglas, y cada pájaro mira solo a sus vecinos cercanos</text>

  <line x1="30" y1="350" x2="970" y2="350" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== Parte B: cómo se reconoce ===== -->
  <text x="30" y="386" font-size="21" font-weight="700" fill="#374151">Cómo se reconoce: tres filtros, tres casos</text>

  <!-- Filtro 1 -->
  <rect x="30" y="404" width="470" height="96" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="50" y="432" font-size="18" font-weight="700" fill="#374151">Test rápido</text>
  <text x="50" y="458" font-size="17" fill="#374151">¿Hay una instrucción que ordene</text>
  <text x="50" y="482" font-size="17" fill="#374151">directamente el patrón?</text>

  <line x1="500" y1="452" x2="597" y2="452" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="548" y="442" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">Sí</text>

  <rect x="600" y="404" width="370" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="620" y="432" font-size="18" font-weight="700" fill="#374151">Caso uno: no es emergencia</text>
  <text x="620" y="458" font-size="17" fill="#374151">Lo ordenó una regla global: en el tick</text>
  <text x="620" y="482" font-size="17" fill="#374151">cincuenta, todos los A a la izquierda.</text>

  <line x1="265" y1="500" x2="265" y2="552" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="280" y="532" font-size="17" font-weight="700" fill="#374151">No: es un candidato</text>

  <!-- Filtro 2 -->
  <rect x="30" y="554" width="470" height="96" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="50" y="582" font-size="18" font-weight="700" fill="#374151">Criterio completo</text>
  <text x="50" y="608" font-size="17" fill="#374151">¿Es el resultado acumulado de las reglas</text>
  <text x="50" y="632" font-size="17" fill="#374151">locales, o venía dado del sorteo inicial?</text>

  <line x1="500" y1="602" x2="597" y2="602" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="548" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">Venía dado</text>

  <rect x="600" y="554" width="370" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="620" y="582" font-size="18" font-weight="700" fill="#374151">Caso dos: todavía no alcanza</text>
  <text x="620" y="608" font-size="17" fill="#374151">Siete azules juntos en un rincón,</text>
  <text x="620" y="632" font-size="17" fill="#374151">puestos por el sorteo inicial.</text>

  <line x1="265" y1="650" x2="265" y2="702" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="280" y="682" font-size="17" font-weight="700" fill="#374151">Lo produjo la dinámica</text>

  <!-- Filtro 3 -->
  <rect x="30" y="704" width="470" height="96" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="50" y="732" font-size="18" font-weight="700" fill="#374151">Lo que refuerza la evidencia</text>
  <text x="50" y="758" font-size="17" fill="#374151">Si sacás o cambiás una regla local,</text>
  <text x="50" y="782" font-size="17" fill="#374151">¿el patrón cambia o desaparece?</text>

  <line x1="500" y1="752" x2="597" y2="752" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="548" y="742" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">Sí</text>

  <rect x="600" y="704" width="370" height="96" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="620" y="732" font-size="18" font-weight="700" fill="#374151">Caso tres: sí es emergencia</text>
  <text x="620" y="758" font-size="17" fill="#374151">Sin la regla de alineación,</text>
  <text x="620" y="782" font-size="17" fill="#374151">la bandada se deshace.</text>
</svg>
