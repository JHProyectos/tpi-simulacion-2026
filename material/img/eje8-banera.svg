<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif" fill="#374151">
  <title>La bañera en diagrama de Forrester</title>
  <defs>
    <marker id="flecha-flujo" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a56db"/>
    </marker>
    <marker id="flecha-info" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <g id="nube">
      <g fill="#374151">
        <circle cx="-22" cy="6" r="18.5"/>
        <circle cx="0" cy="-8" r="22.5"/>
        <circle cx="23" cy="4" r="19.5"/>
        <circle cx="4" cy="14" r="18.5"/>
      </g>
      <g fill="#ffffff">
        <circle cx="-22" cy="6" r="16"/>
        <circle cx="0" cy="-8" r="20"/>
        <circle cx="23" cy="4" r="17"/>
        <circle cx="4" cy="14" r="16"/>
      </g>
    </g>
    <g id="valvula">
      <path d="M-18,-17 L0,0 L-18,17 z M18,-17 L0,0 L18,17 z" fill="#ffffff" stroke="#374151" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <text x="480" y="40" font-size="25" font-weight="700" text-anchor="middle">La bañera en diagrama de Forrester</text>
  <text x="480" y="70" font-size="18" text-anchor="middle">Ejercicio uno: un nivel, dos flujos y dos constantes</text>

  <!-- Caños de los flujos -->
  <line x1="128" y1="250" x2="336" y2="250" stroke="#1a56db" stroke-width="9" marker-end="url(#flecha-flujo)"/>
  <line x1="600" y1="250" x2="808" y2="250" stroke="#1a56db" stroke-width="9" marker-end="url(#flecha-flujo)"/>

  <!-- Nubes -->
  <use href="#nube" x="88" y="250"/>
  <use href="#nube" x="872" y="250"/>

  <!-- Nivel -->
  <rect x="360" y="190" width="240" height="120" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="3.5"/>
  <text x="480" y="245" font-size="26" font-weight="700" text-anchor="middle">Agua</text>
  <text x="480" y="276" font-size="18" text-anchor="middle">nivel, en litros</text>

  <!-- Válvulas -->
  <use href="#valvula" x="240" y="250"/>
  <use href="#valvula" x="720" y="250"/>

  <!-- Constantes y canales de información -->
  <circle cx="160" cy="150" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <circle cx="320" cy="150" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="160" y="127" font-size="17" text-anchor="middle">Entrada inicial</text>
  <text x="320" y="127" font-size="17" text-anchor="middle">Ritmo de cierre</text>
  <line x1="168" y1="159" x2="229" y2="226" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha-info)"/>
  <line x1="312" y1="159" x2="251" y2="226" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha-info)"/>

  <!-- Rótulos de los flujos -->
  <text x="240" y="298" font-size="19" font-weight="700" text-anchor="middle">Entrada</text>
  <text x="240" y="321" font-size="16" text-anchor="middle">litros por minuto</text>
  <text x="720" y="298" font-size="19" font-weight="700" text-anchor="middle">Salida</text>
  <text x="720" y="321" font-size="16" text-anchor="middle">litros por minuto</text>

  <!-- Rótulos de las nubes -->
  <text x="88" y="303" font-size="16" text-anchor="middle">viene de afuera</text>
  <text x="88" y="323" font-size="16" text-anchor="middle">del modelo</text>
  <text x="872" y="303" font-size="16" text-anchor="middle">se va afuera</text>
  <text x="872" y="323" font-size="16" text-anchor="middle">del modelo</text>

  <!-- Idea clave -->
  <text x="480" y="375" font-size="18" font-weight="700" text-anchor="middle" fill="#dc2626">El agua sube mientras la entrada sea mayor que la salida, aunque la entrada baje.</text>

  <!-- Referencias -->
  <line x1="30" y1="400" x2="930" y2="400" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="40" y="420" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="98" y="441" font-size="17">Rectángulo: nivel, lo que se ve en la foto</text>
  <use href="#valvula" x="540" y="435"/>
  <text x="574" y="441" font-size="17">Válvula: flujo, siempre por unidad de tiempo</text>
  <use href="#nube" transform="translate(62 484) scale(0.6)"/>
  <text x="98" y="491" font-size="17">Nube: lo que está afuera del modelo</text>
  <line x1="522" y1="485" x2="560" y2="485" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha-info)"/>
  <text x="574" y="491" font-size="17">Flecha fina: canal de información</text>
</svg>
