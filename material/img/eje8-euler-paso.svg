<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" fill="#374151">
  <title>El tanque con Euler: paso chico contra paso grande</title>
  <defs>
    <marker id="flecha-eje" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="480" y="38" font-size="24" font-weight="700" text-anchor="middle">El tanque con Euler: paso chico contra paso grande</text>
  <text x="480" y="66" font-size="17" text-anchor="middle">Tanque de 100 litros que se vacía; el caudal de salida es la quinta parte del agua, por minuto</text>

  <!-- Zona imposible: agua negativa -->
  <rect x="110" y="310" width="792" height="120" fill="#fee2e2"/>
  <text x="660" y="420" font-size="17" font-weight="700" text-anchor="middle" fill="#dc2626">Agua negativa: imposible en un tanque real</text>

  <!-- Grilla -->
  <line x1="110" y1="110" x2="902" y2="110" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="110" y1="210" x2="902" y2="210" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="110" y1="410" x2="902" y2="410" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="110" y1="310" x2="902" y2="310" stroke="#374151" stroke-width="2.2"/>
  <line x1="110" y1="440" x2="110" y2="84" stroke="#374151" stroke-width="2.2" marker-end="url(#flecha-eje)"/>

  <!-- Marcas del eje vertical -->
  <text x="100" y="116" font-size="16" text-anchor="end">100</text>
  <text x="100" y="216" font-size="16" text-anchor="end">50</text>
  <text x="100" y="316" font-size="16" text-anchor="end">0</text>
  <text x="100" y="416" font-size="16" text-anchor="end">−50</text>
  <text x="40" y="260" font-size="17" text-anchor="middle" transform="rotate(-90 40 260)">agua, en litros</text>

  <!-- Marcas del eje de tiempo -->
  <g font-size="16" text-anchor="middle">
    <line x1="275" y1="430" x2="275" y2="438" stroke="#374151" stroke-width="2"/>
    <line x1="440" y1="430" x2="440" y2="438" stroke="#374151" stroke-width="2"/>
    <line x1="605" y1="430" x2="605" y2="438" stroke="#374151" stroke-width="2"/>
    <line x1="770" y1="430" x2="770" y2="438" stroke="#374151" stroke-width="2"/>
    <line x1="110" y1="430" x2="912" y2="430" stroke="#374151" stroke-width="2.2" marker-end="url(#flecha-eje)"/>
    <text x="110" y="458">0</text>
    <text x="275" y="458">5</text>
    <text x="440" y="458">10</text>
    <text x="605" y="458">15</text>
    <text x="770" y="458">20</text>
  </g>
  <text x="506" y="488" font-size="17" text-anchor="middle">tiempo, en minutos</text>

  <!-- Paso de 1 minuto -->
  <polyline fill="none" stroke="#1a56db" stroke-width="3.5" stroke-linejoin="round"
    points="110,110 143,150 176,182 209,207.6 242,228.1 275,244.5 308,257.6 341,268.1 374,276.4 407,283.2 440,288.5 473,292.8 506,296.3 539,299 572,301.2 605,303 638,304.4 671,305.5 704,306.4 737,307.1 770,307.7 803,308.2 836,308.5"/>
  <g fill="#1a56db">
    <circle cx="143" cy="150" r="4"/><circle cx="176" cy="182" r="4"/><circle cx="209" cy="207.6" r="4"/>
    <circle cx="242" cy="228.1" r="4"/><circle cx="275" cy="244.5" r="4"/><circle cx="308" cy="257.6" r="4"/>
    <circle cx="341" cy="268.1" r="4"/><circle cx="374" cy="276.4" r="4"/><circle cx="407" cy="283.2" r="4"/>
    <circle cx="440" cy="288.5" r="4"/><circle cx="473" cy="292.8" r="4"/><circle cx="506" cy="296.3" r="4"/>
    <circle cx="539" cy="299" r="4"/><circle cx="572" cy="301.2" r="4"/><circle cx="605" cy="303" r="4"/>
    <circle cx="638" cy="304.4" r="4"/><circle cx="671" cy="305.5" r="4"/><circle cx="704" cy="306.4" r="4"/>
    <circle cx="737" cy="307.1" r="4"/><circle cx="770" cy="307.7" r="4"/><circle cx="803" cy="308.2" r="4"/>
    <circle cx="836" cy="308.5" r="4"/>
  </g>

  <!-- Paso de 7,5 minutos -->
  <polyline fill="none" stroke="#d97706" stroke-width="3.5" stroke-linejoin="round"
    points="110,110 357.5,410 605,260 852.5,335"/>
  <g fill="#d97706">
    <circle cx="357.5" cy="410" r="7"/>
    <circle cx="605" cy="260" r="7"/>
    <circle cx="852.5" cy="335" r="7"/>
  </g>
  <circle cx="110" cy="110" r="7" fill="#374151"/>
  <g font-size="17" font-weight="700" fill="#374151">
    <text x="369" y="425">−50</text>
    <text x="605" y="246" text-anchor="middle">25</text>
    <text x="852.5" y="362" text-anchor="middle">−12,5</text>
  </g>
  <text x="122" y="102" font-size="17" font-weight="700">100</text>

  <!-- Referencias -->
  <rect x="540" y="96" width="350" height="122" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="556" y1="124" x2="592" y2="124" stroke="#1a56db" stroke-width="4"/>
  <text x="604" y="130" font-size="17" font-weight="700">Paso de 1 minuto</text>
  <text x="604" y="153" font-size="16">baja suave, como en la realidad</text>
  <line x1="556" y1="182" x2="592" y2="182" stroke="#d97706" stroke-width="4"/>
  <text x="604" y="188" font-size="17" font-weight="700">Paso de 7,5 minutos</text>
  <text x="604" y="211" font-size="16">agua negativa y oscilación falsa</text>

  <text x="480" y="532" font-size="18" font-weight="700" text-anchor="middle">Las oscilaciones las fabrica el método: el tanque real nunca baja de cero.</text>
</svg>
