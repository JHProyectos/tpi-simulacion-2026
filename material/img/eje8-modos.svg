<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Segoe UI, Arial, sans-serif" fill="#374151">
  <title>Los cuatro modos de comportamiento</title>
  <defs>
    <marker id="flecha-eje" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <g id="ejes">
      <line x1="40" y1="225" x2="40" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#flecha-eje)"/>
      <line x1="40" y1="225" x2="414" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#flecha-eje)"/>
      <text x="50" y="88" font-size="16">nivel</text>
      <text x="410" y="246" font-size="16" text-anchor="end">tiempo</text>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>

  <text x="480" y="38" font-size="23" font-weight="700" text-anchor="middle">Cuatro modos de comportamiento y la estructura que los produce</text>

  <!-- 1. Crecimiento exponencial -->
  <g transform="translate(30 62)">
    <rect x="0" y="0" width="435" height="290" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
    <text x="20" y="32" font-size="20" font-weight="700">Crecimiento exponencial</text>
    <circle cx="400" cy="26" r="18" fill="#1a56db"/>
    <text x="400" y="33" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">R</text>
    <text x="20" y="58" font-size="17">Un bucle reforzador dominante</text>
    <use href="#ejes"/>
    <path d="M 45 215 C 220 213, 310 185, 392 88" fill="none" stroke="#1a56db" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="274" font-size="17" font-style="italic">Ejemplo: el interés compuesto</text>
  </g>

  <!-- 2. Búsqueda de objetivo -->
  <g transform="translate(495 62)">
    <rect x="0" y="0" width="435" height="290" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="20" y="32" font-size="20" font-weight="700">Búsqueda de objetivo</text>
    <circle cx="400" cy="26" r="18" fill="#d97706"/>
    <text x="400" y="33" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">B</text>
    <text x="20" y="58" font-size="17">Un bucle compensador</text>
    <use href="#ejes"/>
    <line x1="40" y1="196" x2="404" y2="196" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="404" y="186" font-size="16" text-anchor="end">objetivo</text>
    <path d="M 46 108 C 106 170, 190 192, 400 194" fill="none" stroke="#1a56db" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="274" font-size="17" font-style="italic">Ejemplo: el café que se enfría</text>
  </g>

  <!-- 3. Crecimiento en S -->
  <g transform="translate(30 372)">
    <rect x="0" y="0" width="435" height="290" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
    <text x="20" y="32" font-size="20" font-weight="700">Crecimiento en S</text>
    <circle cx="400" cy="26" r="18" fill="#1a56db"/>
    <text x="400" y="33" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">R</text>
    <text x="20" y="58" font-size="17">Un reforzador que choca con un límite</text>
    <use href="#ejes"/>
    <line x1="40" y1="108" x2="404" y2="108" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="404" y="100" font-size="16" text-anchor="end">límite</text>
    <path d="M 45 214 C 215 214, 215 110, 400 110" fill="none" stroke="#1a56db" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="274" font-size="17" font-style="italic">Ejemplo: un producto nuevo hasta saturar el mercado</text>
  </g>

  <!-- 4. Oscilación -->
  <g transform="translate(495 372)">
    <rect x="0" y="0" width="435" height="290" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="20" y="32" font-size="20" font-weight="700">Oscilación</text>
    <circle cx="400" cy="26" r="18" fill="#d97706"/>
    <text x="400" y="33" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">B</text>
    <text x="20" y="58" font-size="17">Un compensador con una demora</text>
    <use href="#ejes"/>
    <line x1="40" y1="155" x2="404" y2="155" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="404" y="146" font-size="16" text-anchor="end">objetivo</text>
    <path d="M 45 205 C 75 205 75 110 105 110 S 135 200 165 200 S 195 110 225 110 S 255 200 285 200 S 315 110 345 110 " fill="none" stroke="#1a56db" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="274" font-size="17" font-style="italic">Ejemplo: la ducha con un caño largo</text>
  </g>
</svg>
